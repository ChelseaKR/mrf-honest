name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The most useful reports say what you ran,
        what happened, and what you expected instead.

        If this is a security vulnerability, please do not file it here. See
        SECURITY.md for how to report it privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >-
        What you ran and what came back. Paste the output rather than describing it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: >-
        If 45 CFR § 180.50 or the CMS data dictionary says otherwise, quoting it helps a lot.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: The file or page
      description: >-
        The machine-readable file URL, the site page, or the assessment record involved, if
        it is public.
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        The commit, or the "Generated ... from the committed comparison document" line in the
        page footer.
    validations:
      required: true
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: >-
        Environment, workarounds you tried, related issues.
    validations:
      required: false
