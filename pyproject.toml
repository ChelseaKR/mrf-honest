[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrf-honest"
version = "0.1.0.dev0"
description = "Bounded inspection and contracted local ingestion of CMS hospital price-transparency files"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Chelsea Kelly-Reif" }]
dependencies = []

[project.scripts]
mrf-honest = "mrf_honest.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "mypy>=1.18",
    "ruff>=0.15",
    "duckdb>=1.4,<2",
    "pre-commit>=4,<5",
]
lakehouse = [
    "duckdb>=1.4,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mrf_honest"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "C90", "UP", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["src/mrf_honest"]

[tool.coverage.report]
fail_under = 85
show_missing = true
